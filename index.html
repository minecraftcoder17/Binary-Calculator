<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Calculator</title>
    <style>
        body {font-family: monospace, monospace; width: 50%; text-align: center;  margin: 0 auto; font-size: 200%}
        button {font-size: 2;}
    </style>
</head>
<body>
    <br>
    <p>Binary Calculator</p>
    <button id="one" onclick=add(1)>1</button> <button id="zero" onclick="add(0)">0</button><br>
    <button id="plus" onclick="add('+')">+</button> <button id="minus" onclick="add('-')">-</button> <button id="dot" onclick="add('.')">.</button><br>
    <button id="clear" onclick="clearbox()">Clear</button> <button id="enter" onclick="enter()">Enter</button><br><br><br>
    <div id="inputbox"></div>
    
    
    
    <script>
    var running = 0 // the running total
    var current = 0 // current number
    var input = 1 // this does nothing, ignore
    var sign = 1 // +-
    var lastinputfunction = true
    var ispastdecimal = false

    function clearbox(){
        document.getElementById("inputbox").innerHTML = ''
        lastinputfunction = true
        ispastdecimal = false
        running = 0 // the running total
        current = 0 // current number
        input = 1 // this does nothing, ignore
        sign = 1 // +-
    }

    function tobinary(x){
        if (x >= 0){
            return x.toString(2)
        } else {
            return '-'+(-x).toString(2)
        }

    }


    function enter(){
        running+=current*sign
        document.getElementById("inputbox").append(' = ')
        document.getElementById("inputbox").append(tobinary(running))
        document.getElementById("inputbox").append(' (')
        document.getElementById("inputbox").append(running)
        document.getElementById("inputbox").append(')')

        document.getElementById("inputbox").innerHTML += '<br>';
        ispastdecimal = false
        lastinputfunction = true
        running = 0 // the running total
        current = 0 // current number
        input = 1 // this does nothing, ignore
        sign = 1 // +-
    }
    function add(x){
        if(x=='1'||x=='0'){
            document.getElementById("inputbox").append(x)
            lastinputfunction = false
            if(x=='1'){
                current = 2*current+1
            }else{current*=2}
        }else if(x=='.'){
            document.getElementById("inputbox").append(x)
            ispastdecimal = true
        }else if(!lastinputfunction){
            document.getElementById("inputbox").append(x)
            lastinputfunction = true
            running+=current*sign
            if(x=='+'){sign=1}else{sign=-1}
            current = 0
        }
        if(x=='+'||x=='-'){
        }
    }
    </script>
</body>
</html>
